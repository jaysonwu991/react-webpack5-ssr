<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Callout Landing | React Vite SSR</title>
    <meta
      name="description"
      content="Landing-style page template that renders callout content from the server."
    />
    <meta name="theme-color" content="#0f172a" />
    <style>
      :root {
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #0f172a;
        background: radial-gradient(circle at 20% 20%, #e0e7ff 0, #eff6ff 45%, #ffffff 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: inherit;
      }

      .landing-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 3rem 1.25rem;
        gap: 1.5rem;
      }

      .landing-shell__hero {
        flex: 1;
        display: grid;
        place-items: center;
      }

      #root {
        width: min(720px, 100%);
      }
    </style>
    <script
      type="module"
      src="/apps/webapp/src/entry-client.tsx"
      data-entry="true"
    ></script>
    <!--entry-scripts-->
    <!--preload-links-->
  </head>
  <body>
    <div class="landing-shell">
      <header>
        <p style="letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin: 0">
          Landing template
        </p>
        <h1 style="margin: 0; font-size: clamp(2rem, 3vw, 2.5rem)">
          Callout spotlight
        </h1>
        <p style="margin-top: 0.75rem; color: #475569">
          This template lives on the server and uses the callout-only layout so its styles can be scoped independently.
        </p>
      </header>
      <main class="landing-shell__hero">
        <div id="root"><!--app-html--></div>
      </main>
    </div>
    <!--app-state-->
  </body>
</html>
